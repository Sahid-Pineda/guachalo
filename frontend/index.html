<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guáchalo — Catálogo de Emprendedores</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1>Guáchalo</h1>
            <p>Catálogo organizado con stock y precios reales</p>
        </div>
    </header>

    <main class="container">
        <!-- Barra de filtros que resuelve el desorden de redes sociales -->
        <section class="filtros-panel">
            <input type="text" id="input-buscar" placeholder="Buscar artículo (ej. Camiseta, Tenis)...">
            
            <select id="select-categoria">
                <option value="">Todas las categorías</option>
                <option value="1">Camisetas</option>
                <option value="2">Tenis</option>
                <option value="3">Accesorios</option>
            </select>

            <input type="number" id="input-precio" placeholder="Precio máximo (L.)" min="0">

            <label class="checkbox-label">
                <input type="checkbox" id="check-disponibles" checked>
                Solo en stock
            </label>

            <button id="btn-filtrar" class="btn-primario">Filtrar</button>
        </section>

        <!-- Contador de resultados -->
        <p id="contador-resultados" class="contador">Cargando catálogo...</p>

        <!-- Cuadrícula donde JavaScript inyectará las tarjetas -->
        <section id="grid-productos" class="grid-productos"></section>
    </main>

    <script src="app.js"></script>
</body>
</html>
